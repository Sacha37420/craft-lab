version: "3.9"

networks:
  sso-net:
    external: true
    name: sso-lab_sso-net
  dev-net:
    external: true
    name: dev-net

services:

  backend:
    build: ./backend
    container_name: craft-lab-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8097:8000"
    networks:
      - sso-net
      - dev-net
    labels:
      caddy: "${DOMAIN}"
      caddy.handle_path: "/craft-lab-api/*"
      caddy.handle_path.reverse_proxy: "{{upstreams 8000}}"

  frontend:
    build: ./frontend
    container_name: craft-lab-frontend
    restart: unless-stopped
    # Uniquement les variables que lit nginx-entrypoint.sh pour écrire env.js —
    # aucune n'est secrète (env.js est servi au navigateur). `env_file: .env`
    # donnait à ce conteneur nginx tous les secrets de l'app.
    environment:
      DOMAIN: ${DOMAIN:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
      PORT_BACKEND: ${PORT_BACKEND:-}
      PORT_FRONTEND: ${PORT_FRONTEND:-}
      PORT_RELAY: ${PORT_RELAY:-}
      STORAGE_PORT_BACKEND: ${STORAGE_PORT_BACKEND:-}
    ports:
      - "4213:80"
    networks:
      - sso-net
    labels:
      caddy: "${DOMAIN}"
      caddy.handle_path: "/craft-lab/*"
      caddy.handle_path.reverse_proxy: "{{upstreams 80}}"

  relay:
    build: ./relay
    container_name: craft-lab-relay
    restart: unless-stopped
    # Uniquement ce que lit relay/server.js. `env_file: .env` donnait au relais
    # SECRET_KEY, DB_PASSWORD et la clé de chiffrement des clés IA. NODE_ENV
    # n'est pas posé (il ne l'était pas non plus par le .env) : comportement
    # d'express inchangé. Une clé vide fait refuser chaque billet par le backend.
    environment:
      BACKEND_INTERNAL_URL: http://craft-lab-backend:8000
      RELAY_INTERNAL_KEY: ${RELAY_INTERNAL_KEY:-}
    ports:
      - "${PORT_RELAY:-8098}:4310"
    networks:
      - sso-net
      - dev-net
    labels:
      caddy: "${DOMAIN}"
      caddy.handle_path: "/craft-lab-relay/*"
      caddy.handle_path.reverse_proxy: "{{upstreams 4310}}"
